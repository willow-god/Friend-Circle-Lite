  <style>
    :root{--paper:#faf6f1;--paper-deep:#eee3d4;--ink:#4a413b;--muted:#81766b;--sage:#8b9d77;--sage-dark:#5d704b;--sage-pale:#e7ecdf;--tan:#d4a373;--line:#dfd3c3;--white:#fffdfa;--serif:Georgia,"Times New Roman","Songti SC",SimSun,serif;--sans:"寒蝉半圆体","Helvetica Neue",Helvetica,Arial,"Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--paper)}body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans);line-height:1.75;-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(rgba(92,64,51,.12) .45px,transparent .55px);background-size:5px 5px;mix-blend-mode:multiply}a{color:inherit;text-decoration:none}button,input{font:inherit}button{color:inherit}.page{width:min(720px,calc(100% - 40px));margin:0 auto;padding:34px 0 70px;position:relative}
    .site-nav{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:42px;font-family:var(--sans);font-size:12px;letter-spacing:.13em;text-transform:uppercase}.brand{display:inline-flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.08em}.brand-mark{width:8px;height:8px;border-radius:50%;background:var(--sage-dark);display:inline-block}.nav-links{display:flex;gap:22px;color:var(--muted)}.ink-link{position:relative;padding:3px 0}.ink-link:after{content:"";position:absolute;left:0;right:100%;bottom:0;height:2px;background:var(--sage-dark);transform:skewX(-18deg);transition:right .35s ease}.ink-link:hover,.ink-link:focus-visible{color:var(--ink)}.ink-link:hover:after,.ink-link:focus-visible:after{right:-3px}
    .intro{padding:112px 0 0}.kicker{margin:0 0 12px;color:var(--sage-dark);font:600 11px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font:400 clamp(3.3rem,12vw,6.3rem)/1.05 var(--serif);letter-spacing:-.04em;color:var(--ink)}.intro-copy{max-width:560px;margin:26px 0 0;color:#71665c;font-size:17px;line-height:2.05}.intro-rule{width:54px;height:3px;margin-top:34px;border-radius:50%;background:var(--tan);transform:rotate(-2deg)}
    .dashboard{margin-top:120px}.view-switch{display:flex;gap:26px;border-bottom:1px solid var(--line)}.view-button{position:relative;border:0;background:transparent;padding:0 0 13px;cursor:pointer;color:var(--muted);font:600 13px/1.4 var(--sans);letter-spacing:.06em}.view-button:after{content:"";position:absolute;bottom:-1px;left:0;right:100%;height:2px;background:var(--sage-dark);transition:right .3s ease}.view-button.active,.view-button:hover{color:var(--ink)}.view-button.active:after{right:0}.view-button:focus-visible,.filter-button:focus-visible,.search:focus-visible{outline:2px solid var(--sage-dark);outline-offset:4px}
    .summary{display:grid;grid-template-columns:1.35fr repeat(4,1fr);gap:1px;margin-top:38px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.time-cell,.metric{min-width:0;padding:18px 14px 20px 0}.time-cell{padding-left:0}.cell-label{display:block;color:var(--muted);font:600 10px/1.4 var(--sans);letter-spacing:.13em;text-transform:uppercase}.time-value{display:block;margin-top:8px;color:var(--ink);font:400 15px/1.4 var(--sans)}.metric-value{display:block;margin-top:3px;color:var(--ink);font:300 29px/1.15 var(--sans)}.metric-label{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-top:38px}.search-wrap{position:relative}.search-label{display:block;margin-bottom:7px;color:var(--muted);font:600 10px/1.4 var(--sans);letter-spacing:.13em;text-transform:uppercase}.search{width:100%;height:42px;border:0;border-bottom:1px solid var(--line);border-radius:0;outline:0;background:transparent;color:var(--ink);font-size:16px}.search::placeholder{color:#aaa69c}.filters{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.filter-button{border:1px solid var(--line);border-radius:999px;background:transparent;padding:5px 12px;cursor:pointer;color:var(--muted);font:600 11px/1.4 var(--sans);transition:color .2s,background .2s,border-color .2s}.filter-button:hover{border-color:var(--sage);color:var(--sage-dark)}.filter-button.active{border-color:var(--sage-dark);background:var(--sage-dark);color:#fff}
    .board{margin-top:120px}.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:18px;margin-bottom:30px}.board-title{margin:0;font:400 28px/1.3 var(--serif);letter-spacing:-.02em}.source-links{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font:11px/1.5 var(--sans)}.source-links a:hover{color:var(--sage-dark)}.content-grid{display:grid;gap:24px}.content-grid.is-links{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid.is-articles{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}.link-card,.article-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:2rem 1.35rem 2rem 1.35rem;background:var(--white);padding:24px;box-shadow:0 7px 0 rgba(139,157,119,.12);animation:rise .45s ease both;transition:background .35s ease,border-color .35s ease,box-shadow .35s ease,transform .35s ease}.link-card:hover,.article-card:hover{border-color:#c6b59f;background:#fffaf4;box-shadow:0 10px 0 rgba(139,157,119,.18);transform:translateY(-2px)}.link-main{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center}.avatar{width:48px;height:48px;border:2px solid var(--sage-pale);border-radius:1.2rem 50% 50% 50%;object-fit:cover;background:var(--paper-deep)}.name{display:block;font:400 20px/1.35 var(--serif)}.name:hover,.article-title:hover{color:var(--sage-dark)}.url{display:block;margin-top:2px;color:var(--muted);font:11px/1.5 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.link-status{display:inline-block;margin-top:18px;color:var(--sage-dark);font:600 11px/1.4 var(--sans);letter-spacing:.04em}.link-status:before{content:"";display:inline-block;width:7px;height:7px;margin:0 7px 1px 0;border-radius:50%;background:currentColor}.is-unreachable .link-status{color:#a36f62}.link-insight{display:flex;align-items:baseline;gap:12px;margin-top:10px}.insight-label{color:var(--muted);font-size:13px}.insight-value{font:400 20px/1.4 var(--serif)}.surface-facts{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}.surface-fact{display:inline-flex;gap:6px;font-size:12px}.surface-label{color:var(--muted)}.surface-value{font-weight:400}.link-detail{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}.detail-label{display:block;color:var(--muted);font:10px/1.4 var(--sans);letter-spacing:.08em}.detail-value{display:block;margin-top:4px;font-size:13px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .article-card{height:176px;padding:20px;display:flex;flex-direction:column}.article-title{display:-webkit-box;overflow:hidden;padding-right:38px;font:400 18px/1.55 var(--serif);-webkit-box-orient:vertical;-webkit-line-clamp:3}.article-avatar-mark{position:absolute;top:20px;right:20px;width:34px;height:34px}.article-avatar{width:34px;height:34px;border:2px solid var(--sage-pale);border-radius:50% 1.2rem 50% 50%;object-fit:cover;background:var(--paper-deep)}.article-meta{display:flex;justify-content:space-between;gap:12px;margin-top:auto;color:var(--muted);font:11px/1.5 var(--sans)}.author{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.date{white-space:nowrap}.detail-button{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:2px 0;border:0;border-bottom:1px dashed var(--sage);border-radius:0;color:#6f8060;font:600 11px/1.3 var(--sans);transition:color .3s ease,border-color .3s ease,transform .3s ease}.detail-button:after{content:"↗";font-size:14px;line-height:1}.detail-button:hover,.detail-button:focus-visible{border-bottom-color:var(--sage-dark);color:var(--sage-dark);transform:translate(1px,-1px)}.load-more{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:28px 0 0;padding:12px 18px;border:0;border-radius:999px;background:var(--sage-pale);color:var(--sage-dark);cursor:pointer;font:600 12px/1.4 var(--sans);transition:background .35s ease,color .35s ease,transform .35s ease}.load-more:hover,.load-more:focus-visible{background:#dbe4d0;color:var(--ink);transform:translateY(-1px)}.load-more span{font-size:16px;line-height:1}.empty{grid-column:1/-1;padding:52px 0;border:1px dashed var(--line);border-radius:2rem;color:var(--muted);text-align:center;font-size:15px}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:120px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font:11px/1.6 var(--sans)}.footer a:hover{color:var(--sage-dark)}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .link-card,.article-card{animation-delay:calc(var(--card-index,0) * 45ms);box-shadow:7px 7px 0 rgba(139,157,119,.12)}.link-card:hover,.article-card:hover{box-shadow:10px 10px 0 rgba(139,157,119,.18)}
    @media(max-width:620px){.page{width:min(100% - 28px,720px);padding-top:22px}.site-nav{align-items:flex-start}.nav-links{gap:13px}.intro{padding-top:82px}.dashboard,.board,.footer{margin-top:82px}.summary{grid-template-columns:repeat(2,1fr)}.time-cell{grid-column:1/-1;padding-right:0;border-bottom:1px solid var(--line)}.metric{padding-top:14px;padding-bottom:16px}.tools{grid-template-columns:1fr;gap:22px}.filters{justify-content:flex-start}.board-head{align-items:flex-start;flex-direction:column;margin-bottom:18px}.content-grid.is-links,.content-grid.is-articles{grid-template-columns:1fr}.article-card:nth-last-child(-n+2){border-bottom:0}.article-card:last-child{border-bottom:1px solid var(--line)}.footer{align-items:flex-start;flex-direction:column;gap:6px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>

<body>
  <main class="page">
    <nav class="site-nav" aria-label="主导航"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span> Friend Circle Lite</a><div class="nav-links"><a class="ink-link" href="#directory">目录</a><a class="ink-link" href="./link.json" target="_blank" rel="noopener noreferrer">数据</a><a class="ink-link" href="https://github.com/willow-god/Friend-Circle-Lite" target="_blank" rel="noopener noreferrer">GitHub</a></div></nav>
    <header class="intro"><p class="kicker">A quiet index of good places</p><h1>友链清册</h1><p class="intro-copy" id="view-description">把值得访问的站点与近来的文字，安静地收在同一页。</p><div class="intro-rule" aria-hidden="true"></div></header>
    <section class="dashboard" aria-label="数据概览"><div class="view-switch" role="tablist" aria-label="数据视图切换"><button class="view-button active" data-view="links" type="button" role="tab" aria-selected="true">友链状态</button><button class="view-button" data-view="articles" type="button" role="tab" aria-selected="false">最近文章</button></div><div class="summary" id="summary"></div><div class="tools"><label class="search-wrap"><span class="search-label">Search the directory</span><input class="search" id="search" type="search" placeholder="搜索名称、链接或文章" autocomplete="off"></label><div class="filters" id="filters" aria-label="筛选条件"></div></div></section>
    <section class="board" id="directory"><header class="board-head"><h2 class="board-title" id="section-title">友链可达性数据</h2><nav class="source-links" aria-label="数据源"><a href="./link.json" target="_blank" rel="noopener noreferrer">link.json</a><a href="./all.json" target="_blank" rel="noopener noreferrer">all.json</a></nav></header><section class="content-grid" id="content" aria-live="polite"></section><button class="load-more" id="load-more" type="button" hidden><span aria-hidden="true">＋</span>加载更多</button></section>
    <footer class="footer"><span>Powered by <a href="https://github.com/willow-god/Friend-Circle-Lite" target="_blank" rel="noopener noreferrer">Friend-Circle-Lite</a></span><span>Designed by <a href="https://www.liushen.fun/" target="_blank" rel="noopener noreferrer">LiuShen</a></span></footer>
  </main>
  <script>
    const state={view:"links",filter:"unreachable",keyword:"",links:[],articles:[],linkStats:{},articleStats:{},linkLimit:6,articleLimit:12};
    const viewConfig={links:{title:"友链可达性数据",description:"记录站点连通、RSS 可抓取、反链与参考延迟，轻轻翻看便知近况。",defaultFilter:"unreachable",filters:[["unreachable","不可达"],["uncrawlable","不可抓取"],["noBacklink","无反链"],["stale","久未更新"],["all","全部"]]},articles:{title:"友链朋友圈数据",description:"把友链最近的文章汇入同一张稿纸，按时间排列，保留每一位作者的来处。",defaultFilter:"first24",filters:[["first24","前 24 条"],["today","今日"],["week","近 7 天"],["month","近 30 天"],["all","全部"]]}};
    Promise.all([fetchJSON("./link.json"),fetchJSON("./all.json")]).then(([lp,ap])=>{state.links=normalizeLinks(lp);state.linkStats=normalizeLinkStats(lp);state.articles=ap.article_data||[];state.articleStats=ap.statistical_data||{};render()}).catch(error=>{document.getElementById("content").innerHTML=`<div class="empty">数据加载失败：${escapeHTML(error.message)}</div>`});
    document.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>{state.view=button.dataset.view;state.filter=viewConfig[state.view].defaultFilter;state.linkLimit=6;state.articleLimit=12;document.querySelectorAll("[data-view]").forEach(item=>{item.classList.remove("active");item.setAttribute("aria-selected","false")});button.classList.add("active");button.setAttribute("aria-selected","true");render()}));
    document.getElementById("search").addEventListener("input",event=>{state.keyword=event.target.value.trim().toLowerCase();state.linkLimit=6;state.articleLimit=12;renderContent()});
    document.getElementById("load-more").addEventListener("click",()=>{if(state.view==="links"){state.linkLimit+=6;renderLinks()}else{state.articleLimit+=12;renderArticles()}});
    function fetchJSON(url){return fetch(url).then(response=>{if(!response.ok)throw new Error(`${url} ${response.status}`);return response.json()})}
    function normalizeLinks(payload){const items=payload.links||payload.link_data||[];return items.map(item=>({name:item.name||"",url:item.url||item.link||"",page:item.page||item.link_page||"",avatar:item.avatar||"",ok:"ok"in item?item.ok:Boolean(item.reachable),rss:"rss"in item?item.rss:Boolean(item.crawlable),latency:item.latency,unreachable_days:item.unreachable_days??null,backlink:"backlink"in item?item.backlink:item.has_backlink,updated:item.updated||item.last_post_published||"",stale_days:item.stale_days??item.last_post_days_ago??null}))}
    function normalizeLinkStats(payload){const s=payload.stats||payload.statistical_data||{};return{total:s.total??s.link_total_num,ok:s.ok??s.link_reachable_num,rss:s.rss??s.crawl_allowed_num,backlink:s.backlink??s.has_author_link_num,checked:s.checked??s.link_last_checked_time}}
    function render(){const c=viewConfig[state.view];document.getElementById("view-description").textContent=c.description;document.getElementById("section-title").textContent=c.title;renderSummary();renderFilters();renderContent()}
    function renderSummary(){const items=state.view==="links"?linkMetrics():articleMetrics();const time=state.view==="links"?state.linkStats.checked:state.articleStats.last_updated_time;document.getElementById("summary").innerHTML=`<div class="time-cell"><span class="cell-label">Last checked</span><strong class="time-value">${escapeHTML(time||"暂无记录")}</strong></div>`+items.map(([label,value])=>`<div class="metric"><span class="metric-label">${escapeHTML(label)}</span><strong class="metric-value">${escapeHTML(value)}</strong></div>`).join("")}
    function linkMetrics(){const s=state.linkStats;return[["友链总数",s.total??state.links.length],["可达友链",s.ok??state.links.filter(x=>x.ok).length],["可抓取 RSS",s.rss??state.links.filter(x=>x.rss).length],["有反链",s.backlink??state.links.filter(x=>x.backlink).length]]}
    function articleMetrics(){const s=state.articleStats;const authors=new Set(state.articles.map(x=>x.author).filter(Boolean));return[["友链总数",s.friends_num??state.links.length],["活跃站点",s.active_num??authors.size],["文章数量",s.article_num??state.articles.length],["异常站点",s.error_num??0]]}
    function renderFilters(){document.getElementById("filters").innerHTML=viewConfig[state.view].filters.map(([key,label])=>`<button class="filter-button ${key===state.filter?"active":""}" data-filter="${key}" type="button">${label}</button>`).join("");document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{state.filter=button.dataset.filter;state.linkLimit=6;state.articleLimit=12;renderFilters();renderContent()}))}
    function renderContent(){const content=document.getElementById("content");content.className=`content-grid ${state.view==="links"?"is-links":"is-articles"}`;state.view==="links"?renderLinks():renderArticles()}
    function renderLinks(){const links=state.links.filter(matchKeywordForLink).filter(matchLinkFilter).sort(sortLinks);const visible=links.slice(0,state.linkLimit);document.getElementById("content").innerHTML=visible.map((link,index)=>renderLinkCard(link,index)).join("")||`<div class="empty">当前条件下没有友链数据</div>`;const loadMore=document.getElementById("load-more");loadMore.innerHTML='<span aria-hidden="true">＋</span>加载更多友链';loadMore.hidden=visible.length>=links.length}
    function renderLinkCard(link,index){const featured=isFeatured(link),insight=primaryInsight(link),cc=["link-card",featured?"featured":"",!link.ok?"is-unreachable":link.rss&&link.stale_days!==null?"is-stale":"is-healthy"].filter(Boolean).join(" ");return`<article class="${cc}" style="--card-index:${index%12}"><div class="link-main"><img class="avatar" src="${escapeAttr(link.avatar||"./favicon.ico")}" alt="" loading="lazy" onerror="this.src='./favicon.ico'"><div><a class="name" href="${escapeAttr(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(link.name)}</a><a class="url" href="${escapeAttr(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(link.url)}</a></div></div><span class="link-status">${escapeHTML(insight.status)}</span><div class="link-insight"><span class="insight-label">${escapeHTML(insight.label)}</span><strong class="insight-value">${escapeHTML(insight.value)}</strong></div>${renderSurfaceFacts(link)}${featured?renderLinkDetails(link):""}</article>`}
    function primaryInsight(link){if(!link.ok)return{status:"暂不可达",label:"不可达时长",value:formatUnreachableDays(link)};if(link.rss&&link.stale_days!==null&&link.stale_days!==undefined)return{status:"RSS 可解析",label:"最近更新",value:`${link.stale_days} 天未更新`};if(link.rss)return{status:"RSS 可解析",label:"最近更新",value:compactUpdateAge(link)};return{status:"站点可达",label:"可用性",value:"在线"}}
    function renderSurfaceFacts(link){return`<div class="surface-facts">${surfaceFacts(link).map(([label,value])=>`<span class="surface-fact"><span class="surface-label">${escapeHTML(label)}</span><strong class="surface-value">${escapeHTML(value)}</strong></span>`).join("")}</div>`}
    function surfaceFacts(link){if(!link.ok)return[["不可达",formatUnreachableDays(link)],["反链",formatBacklink(link)],["文章",compactUpdateAge(link)]];if(link.rss&&link.stale_days!==null&&link.stale_days!==undefined)return[["状态","在线"],["反链",formatBacklink(link)],["延迟",formatLatency(link.latency)]];return[["RSS",formatRss(link)],["更新",compactUpdateAge(link)],["反链",formatBacklink(link)]]}
    function renderLinkDetails(link){return`<div class="link-detail">${visibleDetails(link).map(([label,value,href])=>`<span><span class="detail-label">${escapeHTML(label)}</span>${href?`<a class="detail-button" href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">查看友链页</a>`:`<strong class="detail-value">${escapeHTML(value)}</strong>`}</span>`).join("")}</div>`}
    function visibleDetails(link){if(state.filter==="unreachable")return[["不可达时长",formatUnreachableDays(link)],["友链页",link.page?"已记录":"暂无记录",link.page],["文章",compactUpdateAge(link)]];if(state.filter==="stale")return[["未更新",formatStaleDays(link)],["最近",link.updated||"暂无记录"],["站点",link.ok?"在线":"离线"]];if(state.filter==="uncrawlable")return[["RSS",formatRss(link)],["最近",link.updated||"暂无记录"],["延迟",formatLatency(link.latency)]];if(state.filter==="noBacklink")return[["反链",formatBacklink(link)],["友链页",link.page||"暂无记录",link.page],["状态",link.ok?"站点可达":"站点不可达"]];return[]}
    function renderArticles(){let articles=state.articles.filter(matchKeywordForArticle).filter(matchArticleFilter);const total=articles.length;if(state.filter==="first24")articles=articles.slice(0,state.articleLimit);document.getElementById("content").innerHTML=articles.map((article,index)=>renderArticleCard(article,index)).join("")||`<div class="empty">当前条件下没有朋友圈文章</div>`;const loadMore=document.getElementById("load-more");loadMore.innerHTML='<span aria-hidden="true">＋</span>加载更多文章';loadMore.hidden=state.filter!=="first24"||state.articleLimit>=total;}
    function renderArticleCard(article,index){return`<article class="article-card" style="--card-index:${index%12}"><span class="article-avatar-mark"><img class="article-avatar" src="${escapeAttr(article.avatar||"./favicon.ico")}" alt="" loading="lazy" onerror="this.src='./favicon.ico'"></span><a class="article-title" href="${escapeAttr(article.link)}" target="_blank" rel="noopener noreferrer">${escapeHTML(article.title||"无标题")}</a><div class="article-meta"><span class="author">${escapeHTML(article.author||"未知作者")}</span><span class="date">${escapeHTML(article.created||"")}</span></div></article>`}
    function matchKeywordForLink(link){return!state.keyword||[link.name,link.url,link.page].some(v=>String(v||"").toLowerCase().includes(state.keyword))}function matchKeywordForArticle(article){return!state.keyword||[article.title,article.author,article.link].some(v=>String(v||"").toLowerCase().includes(state.keyword))}
    function matchLinkFilter(link){if(state.filter==="unreachable")return!link.ok;if(state.filter==="stale")return link.rss&&link.stale_days!==null;if(state.filter==="uncrawlable")return!link.rss;if(state.filter==="noBacklink")return link.backlink!==true;return true}
    function matchArticleFilter(article){if(state.filter==="all"||state.filter==="first24")return true;const date=parseArticleDate(article.created);if(!date)return false;const diff=(new Date()-date)/86400000;if(state.filter==="today")return diff>=0&&diff<1;if(state.filter==="week")return diff>=0&&diff<=7;if(state.filter==="month")return diff>=0&&diff<=30;return true}function parseArticleDate(value){if(!value)return null;const date=new Date(String(value).replace(" ","T"));return Number.isNaN(date.getTime())?null:date}
    function sortLinks(a,b){if(state.filter==="unreachable")return Number(b.unreachable_days||0)-Number(a.unreachable_days||0)||a.name.localeCompare(b.name,"zh-Hans-CN");if(state.filter==="stale")return Number(b.stale_days??-1)-Number(a.stale_days??-1)||a.name.localeCompare(b.name,"zh-Hans-CN");if(state.filter==="uncrawlable")return normalizeSortLatency(a.latency)-normalizeSortLatency(b.latency);if(state.filter==="noBacklink")return Number(b.ok)-Number(a.ok)||a.name.localeCompare(b.name,"zh-Hans-CN");return linkRank(a)-linkRank(b)||a.name.localeCompare(b.name,"zh-Hans-CN")}function normalizeSortLatency(value){const latency=Number(value);return Number.isFinite(latency)&&latency>=0?latency:99999}function linkRank(link){if(!link.ok)return 0;if(!link.rss)return 1;return 2}function isFeatured(link){if(state.filter==="unreachable")return!link.ok;if(state.filter==="stale")return link.rss&&link.stale_days!==null;if(state.filter==="uncrawlable")return!link.rss;if(state.filter==="noBacklink")return link.backlink!==true;return false}
    function formatLatency(value){const latency=Number(value);return!Number.isFinite(latency)||latency<0?"无延迟":`${latency.toFixed(2)} 秒`}function formatUnreachableDays(link){const days=Math.ceil(Number(link.unreachable_days));return!Number.isFinite(days)||days<=0?"暂无记录":`${days} 天`}function compactUpdateAge(link){if(link.stale_days!==null&&link.stale_days!==undefined)return`${link.stale_days} 天未更新`;return link.updated?"有记录":"暂无记录"}function formatRss(link){return link.rss?"可解析":"未解析"}function formatStaleDays(link){return link.stale_days===null||link.stale_days===undefined?"暂无记录":`${link.stale_days} 天`}function formatBacklink(link){return link.backlink===true?"已确认":link.backlink===false?"未发现":"未检测"}function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}function escapeAttr(value){return escapeHTML(value)}
  </script>
